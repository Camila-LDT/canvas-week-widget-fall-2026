<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week Calculator Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Force exact 12pt (16px) Arial font globally */
            font-family: Arial, sans-serif;
            font-size: 16px; 
            /* Transparent background so Canvas shows through perfectly */
            background-color: transparent; 
            margin: 0;
            padding: 2px; /* Slight padding prevents border-box shadow clipping */
            /* Prevent scrollbars inside the Canvas iframe */
            overflow: hidden;
        }
        
        /* Ensuring all inputs and child elements inherit the exact font requirements */
        * {
            font-family: inherit;
            font-size: inherit;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <!-- Main Container: Light Grey (#F5F5F5), Border (#C7CDD1), Rounded 4px -->
    <div class="bg-[#F5F5F5] border border-[#C7CDD1] rounded-[4px] flex flex-col md:flex-row items-center justify-between px-6 py-4 w-full shadow-sm" role="region" aria-label="Academic Week Calculator">
        
        <div class="flex flex-col mb-4 md:mb-0 w-full md:w-auto">
            <!-- Title: Dark Blue (#002B6B), Bold -->
            <h2 class="font-bold text-[#002B6B] m-0 leading-tight">What week am I in?</h2>
            <!-- Subtitle: Accessible Dark Grey (#556572) -->
            <p class="text-[#556572] m-0 mt-1">Fall Semester: Mon, Sep 7 – Fri, Dec 18, 2026</p>
        </div>

        <!-- gap-6 guarantees balanced spacing between internal elements and outer padding -->
        <div class="flex items-center gap-6 w-full md:w-auto justify-between md:justify-end">
            
            <!-- Date Picker Section -->
            <div class="flex items-center gap-2">
                <label for="datePicker" class="font-bold text-[#2D3B45]">Date:</label>
                <input 
                    type="date" 
                    id="datePicker" 
                    class="bg-white border border-[#C7CDD1] text-[#2D3B45] rounded-[4px] px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#002B6B] focus:border-transparent transition-all"
                    aria-label="Select Date"
                    aria-describedby="resultText"
                >
            </div>
            
            <!-- Result Box: White bg, Dark Grey Text (#2D3B45) as requested -->
            <div aria-live="polite" aria-atomic="true" class="flex items-center">
                <span id="resultText" class="bg-white border border-[#C7CDD1] text-[#2D3B45] font-bold px-4 py-1.5 rounded-[4px] min-w-[110px] text-center shadow-sm">
                    --
                </span>
            </div>

        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const datePicker = document.getElementById('datePicker');
            const resultText = document.getElementById('resultText');

            // Define exact 15-week semester bounds
            const startDateStr = '2026-09-07'; 
            const endDateStr = '2026-12-18';   

            // Helper to correctly parse dates ignoring timezone shifts
            const parseLocalDate = (dateStr) => {
                const [year, month, day] = dateStr.split('-');
                return new Date(year, month - 1, day);
            };

            const startDate = parseLocalDate(startDateStr);
            const endDate = parseLocalDate(endDateStr);

            // Populate the picker with today's date on load
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            
            datePicker.value = `${yyyy}-${mm}-${dd}`;

            function calculateWeek() {
                if (!datePicker.value) {
                    resultText.textContent = "--";
                    return;
                }

                const selectedDate = parseLocalDate(datePicker.value);
                const start = startDate.getTime();
                const end = endDate.getTime();
                const selected = selectedDate.getTime();

                // Validate against academic calendar bounds
                if (selected < start) {
                    resultText.textContent = "Not Started";
                } else if (selected > end) {
                    resultText.textContent = "Term Ended";
                } else {
                    // Standard week calculation logic
                    // Since start date is a Monday, every 7 days increment naturally lands on the next Monday
                    const diffTime = selected - start;
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    const weekNumber = Math.floor(diffDays / 7) + 1;
                    
                    resultText.textContent = `Week ${weekNumber}`;
                }
            }

            // Execute calculation on initial load
            calculateWeek();
            
            // Re-calculate whenever the user changes the date
            datePicker.addEventListener('change', calculateWeek);
        });
    </script>
</body>
</html>
