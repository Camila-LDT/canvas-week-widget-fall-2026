<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Week Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;              /* no scrollbar, ever */
      background: transparent;
      font-family: Arial, sans-serif;
    }

    body { padding: 4px; }

    .widget {
      height: 100%;                  /* card fills the iframe, so no blank gap */
      display: flex;
      flex-wrap: wrap;               /* wraps naturally, no breakpoint needed */
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      padding: 8px 12px;
      background: #F5F5F5;
      border: 1px solid #C7CDD1;
      border-radius: 4px;
    }

    .text { flex: 1 1 220px; min-width: 0; }

    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      color: #00205C;
    }

    .term {
      margin: 2px 0 0;
      font-size: 13px;
      line-height: 1.3;
      color: #556572;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 1 auto;
    }

    label { font-size: 16px; color: #2D3B45; }

    /* 16px font on inputs prevents iOS Safari from zooming on focus */
    input[type="date"], .result {
      height: 36px;
      font: inherit;
      font-size: 16px;
      color: #2D3B45;
      background: #fff;
      border: 1px solid #C7CDD1;
      border-radius: 4px;
    }

    input[type="date"] { padding: 0 8px; min-width: 0; }
    input[type="date"]:focus { outline: 2px solid #00205C; outline-offset: 1px; }

    .result {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      min-width: 80px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* Very small phones: let the date field shrink so the row stays on one line */
    @media (max-width: 360px) {
      label { display: none; }
      .controls { width: 100%; }
      input[type="date"] { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="text">
      <h2>What week am I in?</h2>
      <p class="term">Fall Semester: Mon, Sep 7 – Fri, Dec 18, 2026</p>
    </div>

    <div class="controls">
      <label for="datePicker">Date:</label>
      <input type="date" id="datePicker">
      <div id="resultText" class="result" role="status" aria-live="polite">Week 5</div>
    </div>
  </div>

  <script>
    // Use UTC for all math so daylight saving time can't shift the day count
    const MS_PER_DAY = 24 * 60 * 60 * 1000;
    const START = Date.UTC(2026, 8, 7);    // Mon, Sep 7, 2026 (month is 0-indexed)
    const END   = Date.UTC(2026, 11, 18);  // Fri, Dec 18, 2026

    const datePicker = document.getElementById('datePicker');
    const resultText = document.getElementById('resultText');

    function calculateWeek(value) {        // value looks like "2026-10-08"
      const [y, m, d] = value.split('-').map(Number);
      const date = Date.UTC(y, m - 1, d);

      if (date < START) return 'Not Started';
      if (date > END)   return 'Term Ended';

      const days = Math.round((date - START) / MS_PER_DAY);
      return 'Week ' + (Math.floor(days / 7) + 1);
    }

    function update() {
      resultText.textContent = datePicker.value
        ? calculateWeek(datePicker.value)
        : 'Pick a date';
    }

    // 'input' fires as the user types or picks; 'change' covers older browsers
    datePicker.addEventListener('input', update);
    datePicker.addEventListener('change', update);

    // Default to today's local date
    const t = new Date();
    datePicker.value =
      t.getFullYear() + '-' +
      String(t.getMonth() + 1).padStart(2, '0') + '-' +
      String(t.getDate()).padStart(2, '0');
    update();
  </script>
</body>
</html>
