<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Week Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: transparent; overflow: hidden; margin: 0; padding: 0; }
        .canvas-border { border: 1px solid #C7CDD1; border-radius: 4px; }
    </style>
</head>
<body class="flex items-center justify-center p-1">
    <div class="w-full max-w-4xl canvas-border bg-[#F5F5F5] p-3 flex flex-col md:flex-row md:items-center justify-between gap-3 box-border">
        
        <!-- Left Side: Text -->
        <div class="flex flex-col">
            <h2 class="text-[16px] font-bold text-[#00205C] m-0 leading-tight">What week am I in?</h2>
            <p class="text-[14px] text-[#556572] m-0 mt-1">Fall Semester: Mon, Sep 7 – Fri, Dec 18, 2026</p>
        </div>
        
        <!-- Right Side: Date & Result (Now forced to stay horizontal on mobile!) -->
        <div class="flex flex-row items-center gap-2 w-full md:w-auto justify-between md:justify-end">
            <div class="flex items-center gap-2">
                <label for="datePicker" class="text-[16px] text-[#2D3B45] font-normal">Date:</label>
                <input type="date" id="datePicker" class="canvas-border bg-white text-[16px] text-[#2D3B45] px-2 py-1 h-[36px] outline-none focus:ring-2 focus:ring-[#00205C]">
            </div>
            <div id="resultText" class="canvas-border bg-white text-[16px] text-[#2D3B45] font-bold px-4 h-[36px] flex items-center justify-center whitespace-nowrap min-w-[80px]">
                Week 5
            </div>
        </div>

    </div>

    <script>
        const startDate = new Date('2026-09-07T00:00:00');
        const endDate = new Date('2026-12-18T23:59:59');
        const datePicker = document.getElementById('datePicker');
        const resultText = document.getElementById('resultText');

        function calculateWeek(selectedDate) {
            const date = new Date(selectedDate + 'T00:00:00');
            if (date < startDate) return "Not Started";
            if (date > endDate) return "Term Ended";
            const diffTime = Math.abs(date - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const weekNumber = Math.floor(diffDays / 7) + 1;
            return "Week " + weekNumber;
        }

        datePicker.addEventListener('change', (e) => {
            if (e.target.value) {
                resultText.textContent = calculateWeek(e.target.value);
            }
        });

        // Set default date
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        datePicker.value = `${year}-${month}-${day}`;
        resultText.textContent = calculateWeek(datePicker.value);
    </script>
</body>
</html>
